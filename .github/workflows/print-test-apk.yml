name: Build print-test app
on:
  push:
    paths: ["print-test/**", ".github/workflows/print-test-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        run: gradle -p print-test :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: T57-Print-Test-APK
          path: print-test/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a public download (no GitHub login needed)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp print-test/app/build/outputs/apk/debug/app-debug.apk T57-Print-Test.apk
          gh release delete print-test-latest --yes --cleanup-tag || true
          echo "${GITHUB_RUN_NUMBER}" > version.txt
          gh release create print-test-latest T57-Print-Test.apk version.txt --title "T57 Print Test (latest)" --notes "Latest build of the Trattoria 57 thermal printer test app. Download T57-Print-Test.apk on the Android tablet and install it."
