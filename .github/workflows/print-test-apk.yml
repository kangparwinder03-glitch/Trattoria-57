name: Build print-test app
on:
  push:
    paths: ["print-test/**", ".github/workflows/print-test-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Build APK
        run: gradle -p print-test :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: T57-Print-Test-APK
          path: print-test/app/build/outputs/apk/debug/app-debug.apk
