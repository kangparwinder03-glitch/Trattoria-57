name: DB peek (read-only)
on:
  push:
    paths: ["tools/dbpeek.txt"]
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Read (signed in as the restaurant, read only)
        env:
          T57_EMAIL: ${{ secrets.T57_EMAIL }}
          T57_PASSWORD: ${{ secrets.T57_PASSWORD }}
        shell: python
        run: |
          import json, os, time, urllib.request
          BASE = "https://uzrkewizkqdnqpovwune.supabase.co"; KEY = "sb_publishable_Hix2EgA_xpjxMYFvmarVIQ_Hj0qx3YM"
          def call(url, data=None, method="GET", headers={}):
              req = urllib.request.Request(BASE + url, data=json.dumps(data).encode() if data is not None else None, method=method,
                                           headers={"apikey": KEY, "Content-Type": "application/json", **headers})
              with urllib.request.urlopen(req, timeout=60) as r:
                  b = r.read(); return json.loads(b) if b else None
          tok = call("/auth/v1/token?grant_type=password", {"email": os.environ["T57_EMAIL"], "password": os.environ["T57_PASSWORD"]}, "POST")["access_token"]
          A = {"Authorization": "Bearer " + tok}; now = time.time() * 1000
          print("== printers (heartbeat)")
          for r in call("/rest/v1/t57_docs?coll=eq.printers&select=id,data", headers=A) or []:
              d = r["data"]; print(r["id"], "seen", int((now - d.get("at", 0)) / 1000), "s ago", {k: d.get(k) for k in ("ok", "msg", "off", "down", "paper", "dev")})
          print("== latest printjobs")
          for r in call("/rest/v1/t57_docs?coll=eq.printjobs&select=id,data&order=updated_at.desc&limit=5", headers=A) or []:
              d = r["data"]; print(r["id"], d.get("to"), d.get("title"), "created", int((now - d.get("createdAt", 0)) / 1000), "s ago", "printed" if d.get("printed") else "NOT printed", d.get("printedBy"))
          print("== menu overrides (Edit menu on the tablets)")
          for r in call("/rest/v1/t57_docs?coll=eq.settings&id=eq.menu&select=data", headers=A) or []:
              d = r["data"] or {}
              print("price changes:", json.dumps(d.get("price", {}), ensure_ascii=False))
              print("hidden:", json.dumps(d.get("hide", []), ensure_ascii=False))
              print("added:", json.dumps([[x.get("n"), x.get("cat"), x.get("p")] for x in d.get("add", [])], ensure_ascii=False))
