name: DB peek (read-only)
on:
  push:
    paths: ["tools/dbpeek.txt"]
permissions:
  contents: read
  actions: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: t57-backup-2026-11-27_0417, run-id: "45939085741", github-token: "${{ github.token }}" }
      - name: Compare bookings in this morning's backup with the online database (times and sizes only, no names)
        env:
          T57_EMAIL: ${{ secrets.T57_EMAIL }}
          T57_PASSWORD: ${{ secrets.T57_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in t57-backup.json.gz.enc -out b.json.gz -pass env:T57_PASSWORD
          python3 - <<'PY'
          import json, gzip
          b = json.load(gzip.open("b.json.gz", "rt"))
          print("backup made", b["made"], "rows", len(b["rows"]))
          for r in b["rows"]:
              if r["coll"] == "plan23" and r["id"] >= "2026-11-26":
                  bk = (r["data"] or {}).get("bookings") or {}
                  print(r["id"], "updated", r["updated_at"], "| bookings:", len(bk), "|", sorted([(k, v.get("time"), len(v.get("guests") or []), v.get("status")) for k, v in bk.items()], key=lambda x: str(x[1])))
          for r in b["rows"]:
              if r["coll"] in ("plan23", "train_plan23"): print("B", r["coll"], r["id"], r["updated_at"], len((r["data"] or {}).get("bookings") or {}))
          import urllib.request, os
          BASE = "https://uzrkewizkqdnqpovwune.supabase.co"; KEY = "sb_publishable_Hix2EgA_xpjxMYFvmarVIQ_Hj0qx3YM"
          def call(url, data=None, method="GET", headers={}):
              req = urllib.request.Request(BASE + url, data=json.dumps(data).encode() if data is not None else None, method=method, headers={"apikey": KEY, "Content-Type": "application/json", **headers})
              with urllib.request.urlopen(req, timeout=60) as r:
                  x = r.read(); return json.loads(x) if x else None
          tok = call("/auth/v1/token?grant_type=password", {"email": os.environ["T57_EMAIL"], "password": os.environ["T57_PASSWORD"]}, "POST")["access_token"]
          A = {"Authorization": "Bearer " + tok}
          for r in call("/rest/v1/t57_docs?coll=in.(plan23,train_plan23)&select=coll,id,updated_at,data&order=updated_at.desc", headers=A) or []:
              bk = (r["data"] or {}).get("bookings") or {}
              print("NOW", r["coll"], r["id"], r["updated_at"], len(bk), sorted([(v.get("time"), len(v.get("guests") or []), v.get("status")) for v in bk.values()], key=lambda x: str(x[0])))
          print("recent changes online:", [(r["coll"], r["id"], r["updated_at"]) for r in call("/rest/v1/t57_docs?select=coll,id,updated_at&updated_at=gt.2026-11-27T04:00:00Z&coll=not.in.(printjobs,printers,hub,claims,train_claims)&order=updated_at.desc&limit=40", headers=A) or []])
          from collections import Counter
          print("colls:", dict(Counter(r["coll"] for r in b["rows"])))
          PY
          rm -f b.json.gz
