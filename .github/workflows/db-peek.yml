name: DB peek (read-only)
on:
  push:
    paths: ["tools/dbpeek.txt"]
permissions:
  contents: read
  actions: read
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: t57-backup-2026-11-27_0417, run-id: "45939085741", github-token: "${{ github.token }}" }
      - name: Compare bookings in this morning's backup with the online database (times and sizes only, no names)
        env:
          T57_EMAIL: ${{ secrets.T57_EMAIL }}
          T57_PASSWORD: ${{ secrets.T57_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in t57-backup.json.gz.enc -out b.json.gz -pass env:T57_PASSWORD
          python3 - <<'PY'
          import json, gzip
          b = json.load(gzip.open("b.json.gz", "rt"))
          print("backup made", b["made"], "rows", len(b["rows"]))
          for r in b["rows"]:
              if r["coll"] == "plan23" and r["id"] >= "2026-11-26":
                  bk = (r["data"] or {}).get("bookings") or {}
                  print(r["id"], "updated", r["updated_at"], "| bookings:", len(bk), "|", sorted([(k, v.get("time"), len(v.get("guests") or []), v.get("status")) for k, v in bk.items()], key=lambda x: str(x[1])))
          from collections import Counter
          print("colls:", dict(Counter(r["coll"] for r in b["rows"])))
          PY
          rm -f b.json.gz
