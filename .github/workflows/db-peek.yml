name: Restore today's bookings from the 04:17 backup (one-off)
on:
  push:
    paths: ["tools/dbpeek.txt"]
permissions:
  contents: read
  actions: read
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: t57-backup-2026-11-27_0417, run-id: "45939085741", github-token: "${{ github.token }}" }
      - name: Put back bookings for 2026-11-27 that are missing online (no names in this log)
        env:
          T57_EMAIL: ${{ secrets.T57_EMAIL }}
          T57_PASSWORD: ${{ secrets.T57_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in t57-backup.json.gz.enc -out b.json.gz -pass env:T57_PASSWORD
          python3 - <<'PY'
          import json, gzip, os, urllib.request, time
          DAY = "2026-11-27"
          b = json.load(gzip.open("b.json.gz", "rt"))
          old = next(r["data"] for r in b["rows"] if r["coll"] == "plan23" and r["id"] == DAY)
          BASE = "https://uzrkewizkqdnqpovwune.supabase.co"; KEY = "sb_publishable_Hix2EgA_xpjxMYFvmarVIQ_Hj0qx3YM"
          def call(url, data=None, method="GET", headers={}):
              req = urllib.request.Request(BASE + url, data=json.dumps(data).encode() if data is not None else None, method=method, headers={"apikey": KEY, "Content-Type": "application/json", **headers})
              with urllib.request.urlopen(req, timeout=60) as r:
                  x = r.read(); return json.loads(x) if x else None
          tok = call("/auth/v1/token?grant_type=password", {"email": os.environ["T57_EMAIL"], "password": os.environ["T57_PASSWORD"]}, "POST")["access_token"]
          A = {"Authorization": "Bearer " + tok}
          now = (call(f"/rest/v1/t57_docs?coll=eq.plan23&id=eq.{DAY}&select=data", headers=A) or [{"data": {}}])[0]["data"] or {}
          patch = {k: v for k, v in old.items() if k.startswith("b:") and v and not now.get(k)}
          print("putting back tables:", sorted(patch), [(k, v.get("time"), v.get("size")) for k, v in patch.items()])
          if patch:
              patch["updatedAt"] = int(time.time() * 1000)
              call("/rest/v1/rpc/t57_merge", {"c": "plan23", "i": DAY, "patch": patch}, "POST", A)
          after = (call(f"/rest/v1/t57_docs?coll=eq.plan23&id=eq.{DAY}&select=data,updated_at", headers=A) or [{}])[0]
          print("online now:", after.get("updated_at"), sorted([(k, v.get("time"), v.get("size")) for k, v in (after.get("data") or {}).items() if k.startswith("b:") and v]))
          PY
          rm -f b.json.gz
