name: DB peek (read-only)
on:
  push:
    paths: ["tools/dbpeek.txt"]
jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - name: Read (signed in as the restaurant, read only)
        env:
          T57_EMAIL: ${{ secrets.T57_EMAIL }}
          T57_PASSWORD: ${{ secrets.T57_PASSWORD }}
        shell: python
        run: |
          import json, os, time, urllib.request
          BASE = "https://uzrkewizkqdnqpovwune.supabase.co"; KEY = "sb_publishable_Hix2EgA_xpjxMYFvmarVIQ_Hj0qx3YM"
          def call(url, data=None, method="GET", headers={}):
              req = urllib.request.Request(BASE + url, data=json.dumps(data).encode() if data is not None else None, method=method,
                                           headers={"apikey": KEY, "Content-Type": "application/json", **headers})
              with urllib.request.urlopen(req, timeout=60) as r:
                  b = r.read(); return json.loads(b) if b else None
          tok = call("/auth/v1/token?grant_type=password", {"email": os.environ["T57_EMAIL"], "password": os.environ["T57_PASSWORD"]}, "POST")["access_token"]
          A = {"Authorization": "Bearer " + tok}; now = time.time() * 1000
          print("== bookings (plan23 days from yesterday on; times and party sizes only, no names: this log is public)")
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          y = (datetime.now(ZoneInfo("Europe/London")) - timedelta(days=1)).strftime("%Y-%m-%d")
          for r in call("/rest/v1/t57_docs?coll=eq.plan23&id=gte." + y + "&select=id,updated_at,data&order=id.asc", headers=A) or []:
              d = r["data"] or {}; b = d.get("bookings") or {}
              print(r["id"], "updated", r["updated_at"], "| bookings:", len(b), "|", sorted([(v.get("time"), len(v.get("guests") or []), v.get("status"), "walkin" if v.get("walkin") else "") for v in b.values()], key=lambda x: str(x[0])))
          print("== hub")
          for r in call("/rest/v1/t57_docs?coll=eq.hub&select=id,updated_at,data", headers=A) or []:
              d = r["data"] or {}; print(r["id"], r["updated_at"], "at", d.get("at"), "name", d.get("name"))
