name: Send a one-off print job
on:
  push:
    paths: ["tools/printjob.json"]
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert print job (signed in as the restaurant)
        env:
          T57_EMAIL: ${{ secrets.T57_EMAIL }}
          T57_PASSWORD: ${{ secrets.T57_PASSWORD }}
        shell: python
        run: |
          import json, os, time, urllib.request
          BASE = "https://uzrkewizkqdnqpovwune.supabase.co"; KEY = "sb_publishable_Hix2EgA_xpjxMYFvmarVIQ_Hj0qx3YM"
          def call(url, data=None, method="POST", headers={}):
              req = urllib.request.Request(BASE + url, data=json.dumps(data).encode() if data is not None else None, method=method,
                                           headers={"apikey": KEY, "Content-Type": "application/json", **headers})
              with urllib.request.urlopen(req, timeout=60) as r:
                  b = r.read(); return json.loads(b) if b else None
          tok = call("/auth/v1/token?grant_type=password", {"email": os.environ["T57_EMAIL"], "password": os.environ["T57_PASSWORD"]})["access_token"]
          jobs = json.load(open("tools/printjob.json")); jobs = jobs if isinstance(jobs, list) else [jobs]
          A = {"Authorization": "Bearer " + tok}
          st = {}
          try:
              q = urllib.request.Request(BASE + "/rest/v1/t57_docs?coll=eq.settings&id=eq.main&select=data", headers={"apikey": KEY, **A})
              st = (json.loads(urllib.request.urlopen(q, timeout=60).read()) or [{}])[0].get("data", {}) or {}
          except Exception as e: print("no settings", e)
          revs = [x for x in [{"n": "Google", "u": st.get("review")}, {"n": "TripAdvisor", "u": st.get("ta")}] if x["u"]]
          socs = [x for x in [{"n": "Instagram", "h": "", "u": st.get("ig")}, {"n": "Facebook", "h": "Trattoria 57", "u": st.get("fb")}] if x["u"]]
          for job in jobs:
              d = job["data"]; d["createdAt"] = int(time.time() * 1000)
              k = d.pop("fillQr", None)
              if k is not None:   # same review / social QR codes a real receipt gets
                  if revs: r = revs[k % len(revs)]; d["review"] = r["u"]; d["reviews"] = [r]
                  if socs: d["social"] = [socs[k % len(socs)]]
              call("/rest/v1/t57_docs", job, headers={**A, "Prefer": "resolution=merge-duplicates,return=minimal"})
              print("Sent", job["id"], "to", d["to"], "qr:", d.get("review", "")[:30], [x["n"] for x in d.get("social", [])])
              time.sleep(2)
