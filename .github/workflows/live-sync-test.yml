name: Live sync test (training mode)
on:
  push:
    paths: ["tools/livesync.py", "tools/livesync.txt"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python tools/livesync.py
